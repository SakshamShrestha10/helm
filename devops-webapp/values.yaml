replicaCount: 1
image:
  repository: saksham1997/devopswebapp
  pullPolicy: Always
  tag: "latest"

resources:
  requests:
    cpu: "15m"
    memory: "15Mi"
  limits:
    cpu: "100m"
    memory: "100Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2

targeCPUUtilizationPercentage: 50
targetMemoryUtilizationPercentage: 50

service:
  type: LoadBalancer
  port: 80
  targetPort: 80

ingress:
  enabled: false
